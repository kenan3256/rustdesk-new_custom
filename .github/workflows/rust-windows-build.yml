name: Build RustDesk (Windows)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code with DEEP submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Tam tarixçə yüklə

      - name: Manually Clone Missing Submodules (Fix)
        run: |
          # Köhnə submodul referanslarını sil
          git config --file .gitmodules --name-only --get-regexp path | xargs -I{} git config --file .gitmodules --remove-section {}
          git submodule deinit --all --force
          
          # hbb_common submodulunu manual clone et
          git clone https://github.com/rustdesk/hbb_common libs/hbb_common
          
          # .gitmodules və .git/config fayllarını təmizlə
          git submodule sync
          git submodule update --init --recursive --force
          
          # Qovluqları yoxla
          dir libs\hbb_common

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install Build Tools
        run: |
          choco install -y visualstudio2022-workload-vctools
          rustup default stable-x86_64-pc-windows-msvc

      - name: Build Release
        run: cargo build --release --locked

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-exe
          path: target\release\*.exe