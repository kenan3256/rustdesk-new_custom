name: Build RustDesk (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # @v4 istifadə edin

      - name: Install Rust (stable + Windows target)
        uses: dtolnay/rust-toolchain@master  # Yeni Rust toolchain
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install Windows Build Tools (Link.exe)
        run: |
          choco install -y visualstudio2022-workload-vctools
          rustup default stable-x86_64-pc-windows-msvc

      - name: Build Release
        run: cargo build --release --locked

      - name: List Built Files (Debug)
        run: dir /s target\release\*.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4  # @v4 istifadə edin
        with:
          name: rustdesk-exe
          path: target\release\*.exe
          if-no-files-found: error
          retention-days: 3