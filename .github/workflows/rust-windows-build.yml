
name: Build RustDesk Windows EXE

on:
  push:
    branches:
      - main
  pull_request:  # İstəyə görə PR zamanı da build etmək üçün əlavə edə bilərsiniz
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal  # Daha sürətli quraşdırma üçün
          override: true
          components: rustup, rustc, cargo  # Xüsusi komponentlər

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\.cargo\bin
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release
        run: cargo build --release --locked  # --locked Cargo.lock faylına əməl etmək üçün

      - name: Upload Artifact
        uses: actions/upload-artifact@v3  # v3 istifadə edin
        with:
          name: rustdesk-exe
          path: target/release/*.exe
          if-no-files-found: error  # .exe tapılmasa xəta versin
          retention-days: 5  # Artifact-ın saxlama müddəti
